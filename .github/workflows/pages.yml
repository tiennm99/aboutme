name: Pages

# Publishes the widget and profile.json to GitHub Pages: the "simple" setup in
# docs/setup-simple.md. Needs Settings > Pages > Source set to "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:pages
        env:
          # A fork's own profile (Settings > Secrets and variables > Actions > Variables).
          # When unset, worker/public/profile.json is used.
          ABOUTME_PROFILE: ${{ vars.ABOUTME_PROFILE }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # A separate job, as in GitHub's Pages starter workflows: deploy-pages in the
  # same job can look up the artifact before it is listed and fail.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
